name: docker-image
# Builds the app image (React build + data pipeline + API) on every push to main and publishes it to GitHub's
# container registry: ghcr.io/g3hamza/astrofire:latest (and :<commit sha>). Azure Container Apps runs that image.
# No secrets needed: the built-in GITHUB_TOKEN can publish packages for this repository. LLM keys are set in Azure, never here.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/g3hamza/astrofire:latest
            ghcr.io/g3hamza/astrofire:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/G3hamza/astrofire
            org.opencontainers.image.description=AstroFire - NASA PSI space fire evidence engine
          cache-from: type=gha
          cache-to: type=gha,mode=max
