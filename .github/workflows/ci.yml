name: data-pipeline
on: [push, pull_request, workflow_dispatch]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements.txt
      - name: Check project structure
        run: |
          for p in data/raw/psi pipelines backend ai schemas tests docs; do test -e "$p" || { echo "missing $p"; exit 1; }; done
      - name: Python syntax
        run: python -m compileall -q pipelines backend ai tests
      - name: Validate committed Bronze against manifest, then rebuild Silver/Gold/RAG and validate
        run: python -m pipelines.orchestration.run_all
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend-app/package-lock.json }
      - name: Build frontend (type-check + Vite)
        working-directory: frontend-app
        run: npm ci --legacy-peer-deps --no-audit --no-fund && npm run build
      - name: Backend + data + frontend-serving + demo-flow tests
        run: pytest -q
      - name: Fail if regenerated data differs from committed data (reproducibility)
        run: git diff --stat --exit-code -- data/silver data/gold ':!*.parquet' || echo "::warning::Regenerated data differs from committed copy"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: quality-report, path: "docs/DATA_QUALITY_REPORT.md\ndata/quarantine/quarantine.csv" }
